# XcodeGen spec for MyPet.  Regenerate with:  cd macos && xcodegen generate
name: mypet
options:
  bundleIdPrefix: com.erag
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  # The one third-party dependency: Sparkle 2 for signed, verified app updates.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
settings:
  base:
    MARKETING_VERSION: "0.0.1"
    # Sparkle compares CFBundleVersion, so it equals the release version (see build-app.sh).
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Sparkle updates — the single source for Xcode and scripts/build-app.sh (see docs/UPDATES.md).
    # SPARKLE_PUBLIC_KEY is the *public* half of the EdDSA update key: safe to commit. Set it with
    # scripts/sparkle-keys.sh. The private key stays in your Keychain and in the
    # SPARKLE_PRIVATE_KEY GitHub secret, never in git. While empty, builds can't update themselves.
    SPARKLE_PUBLIC_KEY: ""
    SPARKLE_FEED_URL: "https://eramitgupta.github.io/my-pet/appcast.xml"
    ARCHS: "$(ARCHS_STANDARD)"            # arm64 + x86_64
    ONLY_ACTIVE_ARCH: "NO"
    ENABLE_HARDENED_RUNTIME: "YES"
    # Local builds need no Apple account: sign ad-hoc unless a team is configured.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: "YES"
targets:
  mypet:
    type: application
    platform: macOS
    sources:
      - path: mypet
        excludes:
          - "Assets/Pets/**"
          - "Assets/AppIcon.icns"
      - path: mypet/Assets/Pets
        type: folder           # copied as a folder reference → Contents/Resources/Pets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erag.mypet
        PRODUCT_NAME: MyPet          # → MyPet.app (the name people see)
        PRODUCT_MODULE_NAME: mypet   # Swift module stays `mypet` (tests use @testable import mypet)
        INFOPLIST_FILE: mypet/Info.plist
        CODE_SIGN_ENTITLEMENTS: mypet/mypet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/CPetCore"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../include"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../target/universal/$(CONFIGURATION:lower)"
        OTHER_LDFLAGS: "-lpet_core"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    dependencies:
      - package: Sparkle
      - sdk: IOKit.framework
      - sdk: ServiceManagement.framework
    preBuildScripts:
      - name: Build Rust core
        script: |
          "$SRCROOT/../scripts/build-rust.sh" "$CONFIGURATION"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(SRCROOT)/../target/universal/$(CONFIGURATION:lower)/libpet_core.a"
  mypetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/mypetTests
    dependencies:
      - target: mypet
    settings:
      base:
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/CPetCore"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../include"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MyPet.app/Contents/MacOS/MyPet"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  mypet:
    build:
      targets:
        mypet: all
        mypetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [mypetTests]
    archive:
      config: Release
